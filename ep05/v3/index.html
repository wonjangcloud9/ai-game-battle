<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>어스름 전선 — 새벽과 황혼의 5 대 5</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0d22; }
  body { font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", system-ui, sans-serif; color: #eef0ff;
         -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #game { position: fixed; left: 0; top: 0; display: block; outline: none; }
  #boot { position: fixed; left: 0; top: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center;
          font-size: 18px; color: #9aa0c4; letter-spacing: 0.04em; }
  #err { display: none; position: fixed; left: 12px; bottom: 12px; max-width: 70%; margin: 0; padding: 10px 14px; z-index: 10;
         background: rgba(40, 8, 16, 0.94); color: #ffd0d6; border: 1px solid #ff5a6e; border-radius: 8px;
         font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="boot">어스름 전선 — 등불을 켜는 중…</div>
<canvas id="game" tabindex="0"></canvas>
<pre id="err"></pre>
<noscript><div style="position:fixed;left:0;top:0;right:0;padding:24px;text-align:center">이 게임은 자바스크립트가 필요합니다.</div></noscript>
<script>
/* 스크립트를 불러오지 못했거나 오류가 나면 화면에 알려 준다 */
window.addEventListener('error', function (e) {
  var d = document.getElementById('err'); if (!d) return;
  var t = e.target;
  var msg = (t && t.tagName === 'SCRIPT') ? '파일을 불러오지 못했습니다: ' + t.src.split('/').pop()
          : (e.message || '알 수 없는 오류') + (e.filename ? '  (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '');
  d.style.display = 'block';
  d.textContent = (d.textContent ? d.textContent + '\n' : '오류가 났습니다.\n') + msg;
}, true);
document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
</script>
<script src="js/core.js"></script>
<script src="js/map.js"></script>
<script src="js/data.js"></script>
<script src="js/units.js"></script>
<script src="js/game.js"></script>
<script src="js/ai.js"></script>
<script src="js/aiskills.js"></script>
<script src="js/synth.js"></script>
<script src="js/audio.js"></script>
<script src="js/gfx.js"></script>
<script src="js/art.js"></script>
<script src="js/art2.js"></script>
<script src="js/world.js"></script>
<script src="js/worlddraw.js"></script>
<script src="js/worldfx.js"></script>
<script src="js/ui.js"></script>
<script src="js/uimenu.js"></script>
<script src="js/main.js"></script>
<script>
(function () { var b = document.getElementById('boot'); if (b && window.TW && TW.App && TW.App.canvas) b.style.display = 'none'; })();
</script>
</body>
</html>
