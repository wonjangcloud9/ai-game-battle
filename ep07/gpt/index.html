<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171820">
<title>Riftwake · 유리여울 군도</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23181821'/%3E%3Cpath d='m16 2 3 9-10 17-3-9Zm6 9 5 5-9 13 1-9Z' fill='%23bb99ff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="operations.css">
<link rel="stylesheet" href="squads.css">
<link rel="stylesheet" href="field-log.css">
<link rel="stylesheet" href="wounded-selection.css">
</head>
<body>
<header class="topbar">
  <div class="brand" aria-label="Riftwake"><canvas id="brand" width="192" height="38"></canvas></div>
  <nav aria-label="주 메뉴">
    <button class="nav-button current" data-tab="battle"><i data-icon="battle"></i><span>전장</span></button>
    <button class="nav-button" data-tab="factions"><i data-icon="factions"></i><span>진영 도감</span></button>
    <button class="nav-button" data-tab="guide"><i data-icon="guide"></i><span>플레이 가이드</span></button>
  </nav>
  <div class="header-actions"><button id="sound" class="icon-button" title="소리 끄기" aria-label="소리 끄기"><i data-icon="sound"></i></button><button id="newGame" class="new-game"><i data-icon="restart"></i>새 교전</button></div>
</header>
<main class="game-shell">
  <section class="briefing" aria-label="전장과 보유 자원">
    <div class="map-title"><div class="eyebrow"><span class="small-line"></span>SKIRMISH</div><div class="title-line"><h1 id="mapName">유리여울 군도</h1><span class="mode-chip">섬멸전</span></div></div>
    <div class="resources">
      <button class="resource resource-assign" type="button" id="assignCrystal" title="빛결정 채집에 일꾼 한 기 배정"><i data-art="crystal"></i><span><small>빛결정 <span class="workforce"><span id="crystalWorkers">2기</span><span aria-hidden="true">+</span></span></small><b id="crystal">245</b></span></button>
      <button class="resource resource-assign" type="button" id="assignOre" title="불씨광 채집에 일꾼 한 기 배정"><i data-art="ore"></i><span><small>불씨광 <span class="workforce"><span id="oreWorkers">2기</span><span aria-hidden="true">+</span></span></small><b id="ore">110</b></span></button>
      <button type="button" class="resource resource-assign" id="buildHousing" title="거주지 건설"><i data-art="people"></i><span><small>인구 <span class="housing-plus" aria-hidden="true">+</span></small><b><span id="pop">6</span><em> / </em><span id="cap">18</span></b></span></button>
    </div>
  </section>
  <section class="console" aria-label="실시간 전략 게임">
    <div id="field" class="field">
      <canvas id="world" tabindex="0" aria-label="전장. 아군을 클릭하거나 드래그해 선택하고 지형이나 적을 우클릭해 명령하세요."></canvas>
      <div class="mission">
        <div class="objective"><span class="objective-icon"><i data-icon="objective"></i></span><div><small>작전 목표</small><strong>적 사령부 파괴</strong></div></div>
        <button id="beaconFocus" class="beacon-link" title="남쪽 봉화 위치 보기 · 전투 유닛으로 7초 점령하면 12초마다 자원을 받습니다."><i data-icon="beacon"></i><span class="beacon-caption"><span id="beaconLabel">남쪽 봉화</span><small id="bellClock" hidden></small><small id="ferrySignal" hidden></small></span><b id="beaconStatus">중립</b></button>
        <div id="salvageRow" class="salvage-row" hidden>
          <button id="salvageFocus" type="button"><i data-icon="salvage"></i><span id="salvageLabel">물결 금고</span><b id="salvageState"></b></button>
          <button id="salvageDispatch" type="button" aria-label="물결 금고에 일꾼 한 기 파견">파견</button>
        </div>
      </div>
      <div class="time-controls"><span class="live-dot"></span><time id="clock">00:00</time><button id="speed" title="게임 속도 변경" aria-label="게임 속도 1배. 클릭해 변경">1×</button><button id="pause" class="map-button" title="일시정지 (Space)" aria-label="일시정지"><i data-icon="pause"></i></button></div>
      <div class="map-tools"><button id="routeToggle" aria-pressed="false" title="경유 명령 켜기 · 이동과 공격을 순서대로 예약합니다">경유</button><span></span><button id="zoomOut" class="map-button" title="축소" aria-label="축소"><i data-icon="minus"></i></button><button id="zoomReset" title="기본 배율로 돌아가기">1.0×</button><button id="zoomIn" class="map-button" title="확대" aria-label="확대"><i data-icon="plus"></i></button><span></span><button id="expand" class="map-button" aria-label="전장 넓게 보기" title="전장 넓게 보기"><i data-icon="expand"></i></button></div>
      <div class="combat-tools">
        <button id="ability" class="ability-control" aria-label="진영 전술"><canvas id="abilityIcon" width="32" height="32"></canvas><span><small id="abilityState">진영 전술 · 준비</small><strong id="abilityName">잔광 장막</strong></span><kbd>T</kbd></button>
        <button type="button" class="special-order" id="ashOrder" hidden aria-pressed="false"><i data-art="ash" aria-hidden="true"></i><span><small id="ashState">준비</small><strong id="ashName">잿꽃탄</strong></span><kbd>C</kbd></button>
        <button type="button" class="special-order" id="dewOrder" hidden aria-pressed="false"><i data-art="dew" aria-hidden="true"></i><span><small id="dewState">준비</small><strong id="dewName">이슬매듭</strong></span><kbd>C</kbd></button>
        <button type="button" class="special-order" id="volley" aria-pressed="false" hidden><i data-art="volley" aria-hidden="true"></i><span><small id="volleyState">표식 대기</small><strong id="volleyName">표식 일제사격</strong></span><kbd>C</kbd></button>
      </div>
      <button id="recap" class="recap-button" hidden><i data-icon="guide"></i>교전 결과 보기</button>
      <div id="intelTray" hidden><div class="intel-head"><h3>생산 대기열</h3><button id="rallyBarracks" type="button" class="tray-rally" title="모든 완성된 병영의 집결 지점 지정 (Shift+R)">병영 공동 집결</button><button id="intelClose" class="icon-button" aria-label="대기열 닫기"><i data-icon="close"></i></button></div><div id="intelBody"></div></div>
      <div id="message" role="status"></div>
      <div id="pauseOverlay" hidden><div class="pause-card"><div class="eyebrow">SKIRMISH</div><h2>작전 일시정지</h2><button id="music" class="music-choice"><span>배경 음악</span><b id="musicState">꺼짐</b></button><button id="resume" class="panel-button"><i data-icon="play"></i>전투 재개</button></div></div>
    </div>
    <div class="deck">
      <section class="map-panel"><div class="panel-heading"><i data-icon="radar"></i><h2>전술 지도</h2><span class="panel-accent"></span></div><button id="minimapButton" title="클릭하여 전장 이동" aria-label="전술 지도에서 시점 이동"><canvas id="minimap"></canvas></button></section>
      <section class="selection-panel"><div class="panel-heading"><i data-icon="select"></i><h2>선택 정보</h2><button type="button" id="woundedSelection" hidden></button><span id="selectionCount"></span><button type="button" id="splitForce" class="selection-tool" hidden title="선택한 전투병을 두 부대로 편성 (X)"><i data-art="split"></i><span>부대 나누기</span><kbd>X</kbd></button><button type="button" id="hqDoctrine" class="selection-tool" hidden><i data-art="doctrine"></i><span>교리 연구</span><kbd>Y</kbd></button></div><div id="unitInfo" class="unit-info"></div><div id="production"></div></section>
      <section class="orders-panel"><div class="panel-heading"><i data-icon="command"></i><h2 id="commandsTitle">지휘 명령</h2><button type="button" id="convoy" class="selection-tool" hidden title="선택한 전투병을 노을풀무차의 호위로 편성 (Shift+P)"><span>풀무차 엄호</span> <kbd>⇧P</kbd></button><button type="button" id="expedition" class="selection-tool" hidden title="경비·호위·사수·후퇴 중인 병력을 남기고 출격대 선택 (Shift+F)"><span>출격대</span> <b>0기</b> <kbd>⇧F</kbd></button><button class="tiny-action" id="back" hidden>돌아가기 <kbd>Esc</kbd></button></div><div id="commands" class="commands"></div></section>
    </div>
  </section>
  <footer class="statusbar"><div class="status-left"><span class="live-dot"></span><span id="statusText">교전 중</span><span class="divider"></span><span id="matchInfo">AI 보통</span><span class="divider"></span><button id="idle" class="desk-button" title="대기 중인 일꾼 선택 (I)"><i data-icon="worker"></i><span>유휴 일꾼</span> <b id="idleN">2</b></button><button id="queue" class="desk-button" title="전체 생산 대기열 열기 (V)" aria-controls="intelTray" aria-expanded="false"><i data-icon="queue"></i><span>생산</span> <b id="queueN">0</b><em id="queueTime"></em></button><button type="button" id="fieldLogToggle" class="desk-button" title="전황 기록 열기 (L)"><i data-icon="radar"></i><span>전황</span></button></div><div id="squads"></div><div class="quick-help"><span><i data-icon="mouseLeft"></i>선택</span><span><i data-icon="mouseRight"></i>이동 · 상호작용</span><span><kbd>A</kbd>공격 이동</span><button id="helpOpen" title="조작법 보기"><kbd>?</kbd>도움말</button></div></footer>
</main>
<dialog id="modal"><div class="dialog-inner"><button class="dialog-close icon-button" aria-label="닫기" title="닫기"><i data-icon="close"></i></button><div id="modalContent"></div></div></dialog>
<script src="icons.js"></script><script src="terrain.js"></script><script src="sprites.js"></script><script src="tactics.js"></script><script src="lantern-ferry.js"></script><script src="salvage.js"></script><script src="doctrines.js"></script><script src="scouting.js"></script><script src="bell.js"></script><script src="game.js"></script><script src="audio.js"></script><script src="viewport.js"></script><script src="operations.js"></script><script src="squads.js"></script><script src="field-log.js"></script><script src="wounded-selection.js"></script><script src="interface.js"></script>
</body>
</html>
